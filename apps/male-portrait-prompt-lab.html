<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>男性写真提示词生成器 Male Portrait Prompt Lab</title>
<style>
:root{color-scheme:dark;--bg:#101216;--panel:#181c23;--panel2:#202633;--line:#303848;--text:#eef2f7;--muted:#a9b3c3;--accent:#79c7ff;--ok:#8de6b1}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:Inter,Segoe UI,Arial,sans-serif}
main{max-width:1240px;margin:0 auto;padding:24px}.hero{display:flex;justify-content:space-between;gap:18px;align-items:flex-end;margin-bottom:18px}
h1{margin:0;font-size:30px}.sub{color:var(--muted);margin-top:8px;line-height:1.55}.pill{border:1px solid var(--line);background:var(--panel2);padding:8px 12px;border-radius:999px;color:var(--muted);font-size:13px}
.grid{display:grid;grid-template-columns:360px 1fr;gap:18px}.card{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:16px}
.title{font-weight:700;margin-bottom:12px}.form{display:grid;gap:12px}.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}.three{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px}
label{display:block;color:var(--muted);font-size:13px;margin-bottom:6px}select,textarea,input{width:100%;background:#0f131a;color:var(--text);border:1px solid var(--line);border-radius:7px;padding:10px;font:inherit}
textarea{min-height:86px;resize:vertical}.switch{display:flex;justify-content:space-between;gap:12px;align-items:center;color:var(--muted);font-size:13px}
.btns{display:flex;gap:10px;flex-wrap:wrap}.btn{border:1px solid var(--line);background:var(--panel2);color:var(--text);padding:10px 13px;border-radius:7px;cursor:pointer}.btn:hover{border-color:var(--accent)}.primary{background:var(--accent);color:#08111c;border-color:var(--accent);font-weight:700}.green{background:var(--ok);border-color:var(--ok);color:#07140c;font-weight:700}
.tabs{display:flex;gap:8px;margin-bottom:12px}.tab{padding:9px 12px;border:1px solid var(--line);background:var(--panel2);color:var(--muted);border-radius:7px;cursor:pointer}.tab.active{color:#06111a;background:var(--accent);border-color:var(--accent);font-weight:700}
.out{white-space:pre-wrap;line-height:1.7;background:#0f131a;border:1px solid var(--line);border-radius:8px;padding:14px;min-height:180px;color:#eef3fb}.chipbox{display:flex;gap:8px;flex-wrap:wrap}.chip{padding:6px 9px;border:1px solid var(--line);border-radius:999px;color:var(--muted);font-size:12px;background:var(--panel2)}
.library{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:10px}.item{border:1px solid var(--line);background:#11151d;border-radius:8px;padding:10px}.item b{display:block;margin-bottom:6px}.item p{margin:0;color:var(--muted);font-size:13px;line-height:1.5}
.toast{position:fixed;right:20px;bottom:20px;background:var(--ok);color:#07140c;padding:10px 14px;border-radius:7px;font-weight:700}
@media(max-width:900px){.grid{grid-template-columns:1fr}.hero{display:block}.two,.three{grid-template-columns:1fr}}
</style>
</head>
<body>
<main>
<div class="hero">
  <div>
    <h1>男性写真提示词生成器</h1>
    <div class="sub">面向男士写真、商务肖像、城市街拍、旅拍、运动和国风男装。强调脸部结构、肩背比例、服装质感、镜头和图生视频稳定性。</div>
  </div>
  <div class="pill">standalone HTML · positive + negative · image2video ready</div>
</div>
<div class="grid">
  <section class="card">
    <div class="title">① 人物锚点</div>
    <div class="form">
      <div><label>人脸模板</label><select id="face" onchange="app.generate()"></select></div>
      <div class="two"><div><label>人物数量</label><select id="people" onchange="app.generate()"></select></div><div><label>画幅</label><select id="ratio" onchange="app.generate()"></select></div></div>
      <div><label>体态锚点</label><select id="body" onchange="app.generate()"></select></div>
      <div class="two"><div><label>整体风格</label><select id="style" onchange="app.generate()"></select></div><div><label>去AI味</label><select id="realism" onchange="app.generate()"></select></div></div>
      <div><label>快速设定</label><select id="quickPreset" onchange="app.applyPreset()"></select></div>
      <div class="switch"><span>图生视频适配：主体清晰、衣服稳定</span><input id="i2v" type="checkbox" checked onchange="app.generate()"></div>
      <div class="switch"><span>成人安全边界</span><input id="safe" type="checkbox" checked onchange="app.generate()"></div>
    </div>
  </section>
  <section class="card">
    <div class="title">② 替换模块</div>
    <div class="form">
      <div class="two"><div><label>场景大类</label><select id="sceneGroup" onchange="app.refreshScene();app.syncOutfitToScene(true);app.generate()"></select></div><div><label>具体场景</label><select id="scene" onchange="app.syncOutfitToScene(true);app.generate()"></select></div></div>
      <div class="two"><div><label>服装标准</label><select id="outfitStandard" onchange="app.generate()"></select></div><div><label>完整服装</label><select id="outfit" onchange="app.generate()"></select></div></div>
      <div class="three"><div><label>道具/配饰</label><select id="gear" onchange="app.generate()"></select></div><div><label>姿势</label><select id="pose" onchange="app.generate()"></select></div><div><label>镜头</label><select id="camera" onchange="app.generate()"></select></div></div>
      <div class="two"><div><label>光线</label><select id="light" onchange="app.generate()"></select></div><div><label>用途</label><select id="usage" onchange="app.generate()"></select></div></div>
      <div><label>自定义补充</label><textarea id="custom" oninput="app.generate()" placeholder="例：更像杂志封面、普通街拍、胡茬更自然、衣服褶皱真实、不要精修脸"></textarea></div>
      <div class="btns"><button class="btn primary" onclick="app.generate()">生成提示词</button><button class="btn" onclick="app.randomAll()">随机组合</button><button class="btn green" onclick="app.batch(10)">生成10条变体</button><button class="btn" onclick="app.copyAll()">复制正向+反向</button></div>
    </div>
  </section>
</div>
<section class="card" style="margin-top:18px">
  <div class="tabs"><button class="tab active" onclick="app.showTab('output',this)">正向</button><button class="tab" onclick="app.showTab('negativeTab',this)">反向</button><button class="tab" onclick="app.showTab('batchTab',this)">批量</button><button class="tab" onclick="app.showTab('libraryTab',this)">素材库</button></div>
  <div id="output"><div class="btns" style="margin-bottom:10px"><button class="btn primary" onclick="app.copyAll()">复制正向+反向</button></div><div id="prompt" class="out"></div><div style="height:12px"></div><div id="chips" class="chipbox"></div></div>
  <div id="negativeTab" style="display:none"><div class="btns" style="margin-bottom:10px"><button class="btn primary" onclick="app.copy('negative')">复制反向词</button></div><div id="negative" class="out"></div></div>
  <div id="batchTab" style="display:none"><div class="btns" style="margin-bottom:10px"><button class="btn primary" onclick="app.copy('batchOut')">复制批量</button><button class="btn" onclick="app.batch(20)">生成20条</button></div><div id="batchOut" class="out">点击“生成10条变体”。</div></div>
  <div id="libraryTab" style="display:none"><div class="tabs"><button class="tab active" onclick="app.renderLibrary('scenes',this)">场景</button><button class="tab" onclick="app.renderLibrary('outfits',this)">服装</button><button class="tab" onclick="app.renderLibrary('standards',this)">标准</button><button class="tab" onclick="app.renderLibrary('gear',this)">配饰</button></div><div id="library" class="library"></div></div>
</section>
</main>
