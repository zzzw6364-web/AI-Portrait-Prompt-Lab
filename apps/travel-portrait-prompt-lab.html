      </div>
    </section>

  </div>

   this.setByLabel('style',fixed.style);this.setByLabel('realism',fixed.realism);this.setByLabel('outfitStandard',fixed.standard);
   this.setByLabel('pose',fixed.pose);this.setByLabel('camera',fixed.camera);this.setByLabel('light',fixed.light);this.setByLabel('usage',fixed.usage);this.setByLabel('ratio',fixed.ratio);this.setByLabel('format',fixed.format);
   this.randomSameSeries(state);
   rows.push(`${this.variantMeta(i)}\\n\\n${this.formatPrompt(this.$('prompt').textContent)}`);
  }
  this.$('batchOut').textContent=rows.join('\\n\\n------------------------------\\n\\n');
  this.showTab('batchTab',[...document.querySelectorAll('.card:last-child > .tabs .tab')][2]);
 };
 app.copyAll=function(){this.copyText(this.formatPrompt(this.$('prompt').textContent))};
 app.copyDynamicTemplate=function(){
  const lines=[
   '同一位28岁中国女性，固定脸型与发型，'+this.val('face'),
   '{'+DATA.styles.map(x=>x[1]).join('|')+'}',
   'active fullness slider override: '+this.glamourText(),
   '{'+Object.values(DATA.sceneGroups).flat().filter(x=>!/^双人/.test(x[0])).slice(0,80).map(x=>x[1]).join('|')+'}',
   '{'+DATA.outfits.filter(x=>!/^双人/.test(x[0])).map(x=>x[1]).join('|')+'}',
   'realistic skin texture, natural hair gravity, outfit and shoes readable, no text, no watermark'
  ];
  this.copyText(lines.join(', '));
 };
})();
window.addEventListener('DOMContentLoaded',()=>app.init());
</script>
