<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Image2 人像与商业提示词工具包</title>
  <style>
    :root{
      color-scheme:dark;
      --bg:#111318;--panel:#181b22;--panel2:#20242d;--line:#303641;
      --text:#f2f4f8;--muted:#aab3c2;--accent:#69c2ff;--hot:#ff7a90;--gold:#e7c46b;--ok:#71dc9b;
    }
    *{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:Inter,Segoe UI,Arial,"Microsoft YaHei",sans-serif}
    main{max-width:1280px;margin:0 auto;padding:24px}
    header{display:flex;justify-content:space-between;gap:18px;align-items:flex-start;margin-bottom:16px}
    h1{margin:0 0 8px;font-size:28px;line-height:1.15}p{margin:0;color:var(--muted);line-height:1.6}
    .badge{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);border-radius:999px;padding:7px 11px;color:var(--muted);background:#151820;font-size:13px;white-space:nowrap}
    .layout{display:grid;grid-template-columns:390px 1fr;gap:16px;align-items:start}
    .panel{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:16px}
    .mode{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:14px}
    button,.btn{border:1px solid var(--line);background:var(--panel2);color:var(--text);border-radius:7px;padding:10px 12px;cursor:pointer;font-weight:700}
    button:hover,.btn:hover{border-color:var(--accent)}button.active{border-color:var(--accent);background:#143044;color:#d9f1ff}
    label{display:block;font-size:12px;color:var(--muted);margin:12px 0 6px}
    select,input,textarea{width:100%;border:1px solid var(--line);background:#101217;color:var(--text);border-radius:7px;padding:10px;font:inherit}
    textarea{min-height:76px;resize:vertical}.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}.three{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px}
    .switch{display:flex;align-items:center;justify-content:space-between;gap:10px;border:1px solid var(--line);background:#12151c;border-radius:7px;padding:10px;margin-top:10px;color:var(--muted);font-size:13px}
    input[type=checkbox]{width:18px;height:18px}.actions{display:flex;flex-wrap:wrap;gap:8px;margin-top:14px}.primary{background:#153a4f;border-color:#2d88b8}.green{background:#173c2a;border-color:#2e8e58}.ghost{background:#101217}
    .tabs{display:flex;gap:8px;margin-bottom:12px}.tab{padding:8px 11px;font-size:13px}.tab.active{border-color:var(--accent);background:#143044}
    .out{white-space:pre-wrap;background:#0d0f14;border:1px solid var(--line);border-radius:8px;padding:14px;line-height:1.65;min-height:220px;color:#e8ecf3}
    .meta{display:flex;flex-wrap:wrap;gap:8px;margin:12px 0}.chip{display:inline-flex;border:1px solid var(--line);border-radius:999px;padding:5px 9px;color:var(--muted);font-size:12px;background:#11151d}
    .chip.hot{color:#ffd6dc;border-color:#854050;background:#28141a}.chip.gold{color:#ffe6a3;border-color:#6d5d2a;background:#221e12}.chip.ok{color:#caf7da;border-color:#2f7148;background:#132117}
    .library{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:10px}
    .item{border:1px solid var(--line);background:#12151c;border-radius:8px;padding:12px;min-height:128px}
    .item h3{margin:0 0 8px;font-size:15px}.item p{font-size:13px}.item .tags{margin-top:10px;display:flex;gap:6px;flex-wrap:wrap}
    .mini{font-size:12px;color:var(--muted)}.hidden{display:none}.toast{position:fixed;right:22px;bottom:22px;background:#0d0f14;border:1px solid var(--line);padding:10px 14px;border-radius:8px;color:var(--text)}
    @media(max-width:920px){main{padding:16px}.layout{grid-template-columns:1fr}.two,.three{grid-template-columns:1fr}header{display:block}.badge{margin-top:12px}}

</head>
<body>
<main>
  <header>
    <div>
      <h1>Image2 人像与商业提示词工具包</h1>
      <p>参考公开提示词图库、AI 视觉情报包和创作者工作流，输出短、高信号、可复制的 Image2 提示词。人像强调成人时尚写真与完整衣物覆盖；商业强调产品、品牌、版式与用途。</p>
    </div>
    <span class="badge">Prompt Atlas · Portrait / Commercial</span>
  </header>
  <div class="layout">
    <section class="panel">
      <div class="mode">
        <button id="modePortrait" class="active" onclick="app.setMode('portrait')">人像</button>
        <button id="modeCommercial" onclick="app.setMode('commercial')">商业</button>
      </div>
      <label>快速设定</label>
      <select id="preset" onchange="app.applyPreset()"></select>

      <div id="portraitControls">
        <div class="two">
          <div><label>主体</label><select id="pSubject" onchange="app.generate()"></select></div>
          <div><label>画幅</label><select id="ratio" onchange="app.generate()"></select></div>
        </div>
        <label>脸部审美</label><select id="pFace" onchange="app.generate()"></select>
        <label>丰满与身材表达</label><select id="pBody" onchange="app.generate()"></select>
        <label>完整衣物</label><select id="pOutfit" onchange="app.generate()"></select>
        <div class="two">
          <div><label>场景</label><select id="pScene" onchange="app.generate()"></select></div>
          <div><label>姿势</label><select id="pPose" onchange="app.generate()"></select></div>
        </div>
        <div class="two">
          <div><label>镜头</label><select id="pCamera" onchange="app.generate()"></select></div>
          <div><label>光线</label><select id="pLight" onchange="app.generate()"></select></div>
        </div>
        <div class="two">
          <div><label>写真风格</label><select id="pStyle" onchange="app.generate()"></select></div>
          <div><label>真实质感</label><select id="pRealism" onchange="app.generate()"></select></div>
        </div>
      </div>

      <div id="commercialControls" class="hidden">
        <div class="two">
          <div><label>商业类型</label><select id="cType" onchange="app.generate()"></select></div>
          <div><label>画幅</label><select id="cRatio" onchange="app.generate()"></select></div>
        </div>
        <label>品牌/产品名</label><input id="brand" placeholder="例：Aster Studio / 新款机械键盘 / 夏季香氛" oninput="app.generate()">
        <label>核心产品</label><select id="cProduct" onchange="app.generate()"></select>
        <label>版式结构</label><select id="cLayout" onchange="app.generate()"></select>
        <label>场景与道具</label><select id="cScene" onchange="app.generate()"></select>
        <div class="two">
          <div><label>材质重点</label><select id="cMaterial" onchange="app.generate()"></select></div>
          <div><label>光线</label><select id="cLight" onchange="app.generate()"></select></div>
        </div>
        <label>文案要求</label><select id="cCopy" onchange="app.generate()"></select>
      </div>

      <div class="two">
        <div><label>输出格式</label><select id="format" onchange="app.generate()"></select></div>
        <div><label>用途</label><select id="usage" onchange="app.generate()"></select></div>
      </div>
      <div class="switch"><span>Image2 友好：短提示词、少堆词</span><input id="shortMode" type="checkbox" checked onchange="app.generate()"></div>
      <div class="switch"><span>图生视频首帧：主体和边缘稳定</span><input id="i2v" type="checkbox" checked onchange="app.generate()"></div>
      <label>自定义补充</label><textarea id="custom" oninput="app.generate()" placeholder="例：更像手机抓拍 / 品牌色为银黑 / 需要产品卖点文字准确可读"></textarea>
      <div class="actions">
        <button class="primary" onclick="app.generate()">生成</button>
        <button onclick="app.randomize()">随机</button>
        <button class="green" onclick="app.batch(10)">生成10条变体</button>
        <button class="ghost" onclick="app.copyAll()">复制正向+避开项</button>
      </div>
    </section>

    <section class="panel">
      <div class="tabs">
        <button class="tab active" onclick="app.show('output',this)">输出</button>
        <button class="tab" onclick="app.show('batch',this)">10条变体</button>
        <button class="tab" onclick="app.show('library',this)">模板库</button>
      </div>
      <div id="output">
        <div class="meta" id="meta"></div>
        <div id="result" class="out"></div>
      </div>
      <div id="batch" class="hidden"><div id="batchOut" class="out"></div></div>
      <div id="library" class="hidden">
        <div class="two" style="margin-bottom:12px">
          <input id="searchLib" placeholder="搜索模板、标签、用途" oninput="app.renderLibrary()">
          <select id="libraryMode" onchange="app.renderLibrary()">
            <option value="all">全部</option><option value="portrait">人像</option><option value="commercial">商业</option>
          </select>
        </div>
        <div class="library" id="libraryGrid"></div>
      </div>
    </section>
  </div>
</main>

const AVOID={
 portrait:'minor-coded styling, school styling, risky wardrobe failure, crude pose, overexposed fashion styling, plastic skin, waxy face, over-smoothed beauty filter, doll face, bad hands, extra fingers, distorted body, random extra person, unreadable background, text, watermark',

};
const app={
 mode:'portrait',
 $(id){return document.getElementById(id)},
 fill(id,arr){const e=this.$(id);e.innerHTML='';arr.forEach((x,i)=>{const o=document.createElement('option');o.textContent=x[0];o.value=String(i);o.dataset.text=x[1];e.appendChild(o)})},
 label(id){const e=this.$(id);return e.options?e.options[e.selectedIndex]?.textContent||'':''},
 val(id){const e=this.$(id);return e.options?e.options[e.selectedIndex]?.dataset.text||'':e.value.trim()},
 setByLabel(id,label){const e=this.$(id);const i=[...e.options].findIndex(o=>o.textContent===label);if(i>=0)e.selectedIndex=i},
 init(){
  this.fill('pSubject',DATA.portrait.subject);this.fill('pFace',DATA.portrait.face);this.fill('pBody',DATA.portrait.body);
  this.fill('pOutfit',DATA.portrait.outfits);this.fill('pScene',DATA.portrait.scenes);this.fill('pPose',DATA.portrait.poses);
  this.fill('pCamera',DATA.portrait.cameras);this.fill('pLight',DATA.portrait.lights);this.fill('pStyle',DATA.portrait.styles);this.fill('pRealism',DATA.portrait.realism);
  this.fill('cType',DATA.commercial.type);this.fill('cProduct',DATA.commercial.product);this.fill('cLayout',DATA.commercial.layout);
  this.fill('cScene',DATA.commercial.scene);this.fill('cMaterial',DATA.commercial.material);this.fill('cLight',DATA.commercial.light);this.fill('cCopy',DATA.commercial.copy);
  this.fill('ratio',DATA.ratios);this.fill('cRatio',DATA.ratios);this.fill('format',DATA.formats);this.fill('usage',DATA.usage);
  this.renderPresets();this.applyPreset();this.renderLibrary();
 },
 renderPresets(){
  const presets=[
   ['portrait','轻辣热裤城市写真',{pOutfit:'白色方领短上衣浅蓝高腰牛仔热裤厚底凉鞋',pScene:'夜晚街角便利店',pPose:'走路回眸抓拍',pStyle:'手机随手拍'}],
   ['portrait','油光黑贴身职业感',{pOutfit:'油光黑深V贴身长袖上衣高腰西裤尖头高跟',pScene:'高端酒店落地窗',pPose:'正面一手扶腰',pStyle:'真实时尚写真'}],
   ['portrait','新中式马面裙地标',{pOutfit:'蓝白青花短款旗袍上衣黑色马面半裙尖头低跟',pScene:'故宫红墙打卡',pPose:'双手自然提裙摆',pStyle:'小红书打卡图'}],
   ['portrait','低光手机自拍针织',{pOutfit:'黑色露肩包身针织连衣裙低跟玛丽珍',pScene:'低光手机自拍房间',pPose:'坐在窗边侧身',pStyle:'手机随手拍'}],
   ['portrait','红毯银色晚礼服',{pOutfit:'亮银极简低领晚礼服黑色细高跟',pScene:'红毯入口背景板',pPose:'整理项链',pStyle:'奢华杂志封面'}],
   ['commercial','奢华键盘发布海报',{cType:'产品发布海报',cProduct:'奢华机械键盘',cLayout:'中心英雄构图',cScene:'反光黑色台面',cMaterial:'金属与碳纤维',cLight:'强方向光'}],
   ['commercial','香水SMM广告',{cType:'品牌社媒广告',cProduct:'香水瓶',cLayout:'SMM广告版式',cScene:'高级杂志留白',cMaterial:'玻璃与液体',cLight:'月光银冷调'}],
   ['commercial','护肤电商详情主图',{cType:'电商详情页主图',cProduct:'护肤精华瓶',cLayout:'2x2卖点网格',cScene:'自然材质桌面',cMaterial:'玻璃与液体',cLight:'高级柔光'}],
   ['commercial','AI工具项目卡',{cType:'项目卡片海报',cProduct:'AI工具产品卡',cLayout:'项目卡片版式',cScene:'科技蓝灰空间',cMaterial:'屏幕与UI面板',cLight:'科技轮廓光'}]
  ];
  this.presets=presets;const e=this.$('preset');e.innerHTML='';presets.forEach((p,i)=>{const o=document.createElement('option');o.textContent=p[1];o.value=String(i);e.appendChild(o)});
 },
 setMode(m){this.mode=m;this.$('modePortrait').classList.toggle('active',m==='portrait');this.$('modeCommercial').classList.toggle('active',m==='commercial');this.$('portraitControls').classList.toggle('hidden',m!=='portrait');this.$('commercialControls').classList.toggle('hidden',m!=='commercial');this.generate()},
 applyPreset(){
  const p=this.presets[this.$('preset').selectedIndex]||this.presets[0];this.setMode(p[0]);
  Object.entries(p[2]).forEach(([id,label])=>this.setByLabel(id,label));this.generate();
 },
 clean(s){return String(s||'').replace(/[<>]/g,'').trim()},
 short(s){return String(s||'').split(/[,，。;]/).map(x=>x.trim()).filter(Boolean).slice(0,this.$('shortMode').checked?2:4).join(', ')},
 portraitPrompt(){
  const parts=[this.val('pSubject'),this.val('pFace'),this.val('pBody'),this.val('pOutfit'),this.val('pScene'),this.val('pPose'),this.val('pCamera'),this.val('pLight'),this.val('pStyle'),this.val('pRealism'),'Image2-friendly adult fashion portrait, confident and alluring editorial styling, full garment coverage, real fabric folds, natural skin texture',this.val('ratio')];
  if(this.$('i2v').checked)parts.push('first frame for image-to-video, stable face, stable outfit edges, clean hands and readable limbs');
  const custom=this.clean(this.$('custom').value);if(custom)parts.push(custom);
  return parts.map(x=>this.short(x)).filter(Boolean).join(', ')+'.';
 },
 commercialPrompt(){
  const brand=this.clean(this.$('brand').value)||'[brand / product name]';
  const parts=[this.val('cType'),`brand or product: ${brand}`,this.val('cProduct'),this.val('cLayout'),this.val('cScene'),this.val('cMaterial'),this.val('cLight'),this.val('cCopy'),this.val('usage'),'Image2-friendly commercial visual, clear subject hierarchy, premium material response, clean composition',this.val('cRatio')];
  if(this.$('i2v').checked)parts.push('usable as first frame for short ad video, subject remains centered and edges stable');
  const custom=this.clean(this.$('custom').value);if(custom)parts.push(custom);
  return parts.map(x=>this.short(x)).filter(Boolean).join(', ')+'.';
 },
 formatOutput(prompt,avoid){
  const f=this.label('format');
  if(/中文/.test(f))return `正向提示词：\n${prompt}\n\n避开项：\n${avoid}`;
  if(/SDXL/.test(f))return `POSITIVE PROMPT:\n${prompt}\n\nAVOID:\n${avoid}`;
  if(/Midjourney/.test(f))return `${prompt} --ar ${this.mode==='portrait'?'9:16':'4:5'} --style raw\n\nAvoid: ${avoid}`;
  return `Prompt:\n${prompt}\n\nAvoid:\n${avoid}`;
 },
 generate(){
  const prompt=this.mode==='portrait'?this.portraitPrompt():this.commercialPrompt();
  const avoid=AVOID[this.mode];
  this.$('result').textContent=this.formatOutput(prompt,avoid);
  this.$('meta').innerHTML=this.meta().map(x=>`<span class="chip ${x[1]||''}">${x[0]}</span>`).join('');
 },
 meta(){
  return this.mode==='portrait'
   ? [[`模式: 人像`,'hot'],[`衣物: ${this.label('pOutfit')}`,''],[`场景: ${this.label('pScene')}`,''],[`姿势: ${this.label('pPose')}`,''],[`Image2友好`,'ok']]
   : [[`模式: 商业`,'gold'],[`类型: ${this.label('cType')}`,''],[`产品: ${this.label('cProduct')}`,''],[`版式: ${this.label('cLayout')}`,''],[`Image2友好`,'ok']];
 },
 randomPick(id,used){
  const e=this.$(id);let opts=[...e.options].map((o,i)=>({i,label:o.textContent})).filter(x=>!used?.has(x.label));
  if(!opts.length)opts=[...e.options].map((o,i)=>({i,label:o.textContent}));
  const p=opts[Math.floor(Math.random()*opts.length)];e.selectedIndex=p.i;return p.label;
 },
 randomize(){const ids=this.mode==='portrait'?['pOutfit','pScene','pPose','pCamera','pLight','pStyle']:['cType','cProduct','cLayout','cScene','cMaterial','cLight','cCopy'];ids.forEach(id=>this.randomPick(id));this.generate()},
 batch(n=10){
  const rows=[], used={outfit:new Set(),scene:new Set(),pose:new Set(),layout:new Set(),product:new Set()};
  for(let i=1;i<=n;i++){
   if(this.mode==='portrait'){this.randomPick('pOutfit',used.outfit);used.outfit.add(this.label('pOutfit'));this.randomPick('pScene',used.scene);used.scene.add(this.label('pScene'));this.randomPick('pPose',used.pose);used.pose.add(this.label('pPose'));this.randomPick('pLight');this.randomPick('pCamera')}
   else{this.randomPick('cProduct',used.product);used.product.add(this.label('cProduct'));this.randomPick('cLayout',used.layout);used.layout.add(this.label('cLayout'));this.randomPick('cScene',used.scene);used.scene.add(this.label('cScene'));this.randomPick('cMaterial');this.randomPick('cLight')}
   this.generate();
   rows.push(`【变体 ${String(i).padStart(2,'0')}】\n${this.mode==='portrait'?`衣物: ${this.label('pOutfit')}\n场景: ${this.label('pScene')}\n姿势: ${this.label('pPose')}`:`产品: ${this.label('cProduct')}\n版式: ${this.label('cLayout')}\n场景: ${this.label('cScene')}`}\n\n${this.$('result').textContent}`);
  }
  this.$('batchOut').textContent=rows.join('\n\n------------------------------\n\n');this.show('batch',document.querySelectorAll('.tab')[1]);
 },
 show(id,btn){['output','batch','library'].forEach(x=>this.$(x).classList.toggle('hidden',x!==id));document.querySelectorAll('.tab').forEach(x=>x.classList.remove('active'));btn.classList.add('active')},
 renderLibrary(){
  const q=this.clean(this.$('searchLib')?.value||'').toLowerCase(), mode=this.$('libraryMode')?.value||'all';
  const arr=LIB.filter(x=>(mode==='all'||x.mode===mode)&&(!q||(x.title+x.tags.join(' ')+x.text).toLowerCase().includes(q)));
  this.$('libraryGrid').innerHTML=arr.map(x=>`<div class="item"><h3>${x.title}</h3><p>${x.text}</p><div class="tags">${x.tags.map(t=>`<span class="chip">${t}</span>`).join('')}</div></div>`).join('');
 },
 async copyAll(){await this.copyText(this.$('result').textContent)},
 async copyText(text){try{await navigator.clipboard.writeText(text)}catch(e){const ta=document.createElement('textarea');ta.value=text;document.body.appendChild(ta);ta.select();document.execCommand('copy');ta.remove()}this.toast('已复制')},
 toast(msg){const d=document.createElement('div');d.className='toast';d.textContent=msg;document.body.appendChild(d);setTimeout(()=>d.remove(),1500)}
};
window.addEventListener('DOMContentLoaded',()=>app.init());
